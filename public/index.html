<!doctype html><html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e53935"><title>Meistars.lv</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef0f3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17181d}.app{max-width:460px;min-height:100vh;margin:auto;background:#fff}.top{padding:15px 17px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:3}.logo{font-size:24px;font-weight:900}.logo span{color:#e53935}.page{display:none;padding:18px 17px 80px}.on{display:block}h1{font-size:28px}h2{font-size:20px}.card{border:1px solid #e1e3e7;border-radius:17px;padding:15px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cat{border:1px solid #e1e3e7;border-radius:15px;padding:15px;cursor:pointer}.btn{border:0;border-radius:12px;padding:13px 15px;font-weight:750}.red{background:#e53935;color:#fff}.gray{background:#f0f1f3}.full{width:100%}.muted{color:#747880}input,textarea,select{width:100%;padding:13px;border:1px solid #d9dce1;border-radius:12px;margin:5px 0 12px;font-size:16px}textarea{min-height:90px}label{font-size:13px;font-weight:700}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);background:#fff;border-top:1px solid #eee;display:flex}.bottom button{flex:1;border:0;background:none;padding:10px;font-size:11px;color:#777}.bottom .on{color:#e53935;font-weight:800}.hide{display:none}.danger{color:#b71c1c}.admin{background:#111;color:#fff}
</style></head><body><div class="app">
<header class="top"><div class="logo">Meistars<span>.lv</span></div><button class="btn gray" onclick="logout()">Iziet</button></header>
<section id="auth" class="page on"><h1>Meistars.lv</h1><p class="muted">Klientu un meistaru platforma.</p><div class="card"><div class="grid"><button class="btn red" onclick="mode('login')">Ieiet</button><button class="btn gray" onclick="mode('register')">Reģistrēties</button></div><div id="authForm"></div></div></section>
<section id="home" class="page"><h1>Atrodi meistaru</h1><p class="muted">Izveido pasūtījumu un saņem piedāvājumus.</p><button class="btn red full" onclick="newOrder()">＋ Jauns pasūtījums</button><h2>Pakalpojumi</h2><div class="grid"><div class="cat" onclick="newOrder('Krāsošana')">🎨<br>Krāsošana</div><div class="cat" onclick="newOrder('Špaktelēšana')">🧱<br>Špaktelēšana</div><div class="cat" onclick="newOrder('Elektriķis')">⚡<br>Elektriķis</div><div class="cat" onclick="newOrder('Santehniķis')">🚿<br>Santehniķis</div></div><h2>Pasūtījumi</h2><div id="orders"></div></section>
<section id="new" class="page"><button class="btn gray" onclick="show('home')">‹ Atpakaļ</button><h1>Jauns pasūtījums</h1><label>Pakalpojums</label><input id="cat"><label>Apraksts</label><textarea id="desc"></textarea><div class="grid"><div><label>m²</label><input id="area"></div><div><label>Budžets €</label><input id="budget"></div></div><label>Vieta</label><input id="place"><label>Datums</label><input id="date" type="date"><button class="btn red full" onclick="create()">Publicēt</button></section>
<section id="admin" class="page admin"><h1>Admin panelis</h1><div id="stats"></div><h2>Lietotāji</h2><div id="users"></div><h2>Pasūtījumi</h2><div id="adminOrders"></div></section>
<nav id="nav" class="bottom hide"><button class="on" onclick="show('home')">🏠<br>Sākums</button><button onclick="show('home')">📋<br>Pasūtījumi</button><button onclick="show('profile')">👤<br>Profils</button><button id="adminBtn" class="hide" onclick="showAdmin()">⚙️<br>Admin</button></nav>
<section id="profile" class="page"><h1>Profils</h1><div class="card"><b id="me"></b><p id="role" class="muted"></p></div><button class="btn gray full" onclick="logout()">Iziet no konta</button></section>
</div>
<script>
let token=localStorage.getItem('ml_token'),me=JSON.parse(localStorage.getItem('ml_me')||'null');
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');}
function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};return fetch(path,opt).then(async r=>{let x=await r.json();if(!r.ok)throw Error(x.error||'Kļūda');return x})}
function mode(m){document.getElementById('authForm').innerHTML=m==='login'?`<label>E-pasts</label><input id="email" type="email"><label>Parole</label><input id="password" type="password"><button class="btn red full" onclick="login()">Ieiet</button>`:`<label>Vārds</label><input id="name"><label>E-pasts</label><input id="email" type="email"><label>Tālrunis</label><input id="phone"><label>Parole</label><input id="password" type="password"><label>Loma</label><select id="role"><option value="client">Klients</option><option value="worker">Meistars</option></select><button class="btn red full" onclick="register()">Izveidot kontu</button>`}
async function login(){try{let x=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})}).then(r=>r.json());if(!x.token)throw Error(x.error);token=x.token;me=x.user;localStorage.setItem('ml_token',token);localStorage.setItem('ml_me',JSON.stringify(me));boot()}catch(e){alert(e.message)}}
async function register(){try{let x=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,email:email.value,password:password.value,phone:phone.value,role:role.value})}).then(r=>r.json());if(!x.token)throw Error(x.error);token=x.token;me=x.user;localStorage.setItem('ml_token',token);localStorage.setItem('ml_me',JSON.stringify(me));boot()}catch(e){alert(e.message)}}
function boot(){document.getElementById('nav').classList.remove('hide');if(me.role==='admin')document.getElementById('adminBtn').classList.remove('hide');show('home');loadOrders();document.getElementById('me').textContent=me.name;document.getElementById('role').textContent=me.role}
async function loadOrders(){try{let a=await api('/api/orders');document.getElementById('orders').innerHTML=a.map(o=>`<div class="card"><b>${o.category}</b><p>${o.description||''}</p><span>${o.place}</span> · <b>${o.offer_count} piedāv.</b></div>`).join('')||'<p class="muted">Nav pasūtījumu.</p>'}catch(e){}}
function newOrder(c=''){document.getElementById('cat').value=c;show('new')}
async function create(){try{await api('/api/orders',{method:'POST',body:JSON.stringify({category:cat.value,description:desc.value,area:area.value,budget:budget.value,place:place.value,work_date:date.value})});alert('Pasūtījums publicēts');show('home');loadOrders()}catch(e){alert(e.message)}}
async function showAdmin(){try{show('admin');let s=await api('/api/admin/stats'),u=await api('/api/admin/users'),o=await api('/api/admin/orders');stats.innerHTML=`<div class="card">Lietotāji: <b>${s.users}</b> · Pasūtījumi: <b>${s.orders}</b> · Piedāvājumi: <b>${s.offers}</b></div>`;users.innerHTML=u.map(x=>`<div class="card">${x.name}<br><small>${x.email} · ${x.role}</small></div>`).join('');adminOrders.innerHTML=o.map(x=>`<div class="card"><b>${x.category}</b><br>${x.client_name} · ${x.client_email}<br>${x.place}</div>`).join('')}catch(e){alert(e.message)}}
function logout(){localStorage.clear();location.reload()}mode('login');if(token&&me)boot();
</script></body></html>
